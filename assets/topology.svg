<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510" role="img" aria-labelledby="title desc">
<title id="title">Virtualized Enterprise Security and Monitoring Homelab</title>
<desc id="desc">FortiGate links VMware NAT to an isolated LAN with DC01, Renz, Linux01, Kali, WEB01, Wazuh and Splunk. WEB01 proxies to a loopback-only Juice Shop container. Dashed lines show logical telemetry, not an inline security device. A05 single-quote alert observed; remaining evidence review in progress.</desc>
