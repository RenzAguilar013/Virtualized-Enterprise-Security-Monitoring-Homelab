<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260">
  <title>Virtualized Enterprise Security and Monitoring Homelab</title>
  <desc>Network topology with FortiGate, VMnet2 hosts, Kali, WEB01, Wazuh and Splunk. WEB01 runs Trivy for local SBOM and dependency assessment; JSON findings are sent to both SIEMs. The original card-based design and network addresses are retained.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#243b64"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e3a5f" flood-opacity=".13"/>
    </filter>
    <style>
      .title{font:700 29px Arial,sans-serif;fill:#112d70}.subtitle{font:700 14px Arial,sans-serif;fill:#1559bd}
      .h{font:700 15px Arial,sans-serif}.ip{font:700 13px Arial,sans-serif}.t{font:400 12px Arial,sans-serif;fill:#172033}.s{font:400 11px Arial,sans-serif;fill:#303a50}
      .card{fill:#fff;stroke-width:2;rx:8;filter:url(#soft)}.section{fill:#fff;stroke-width:1.7;rx:7}
      .line{fill:none;stroke:#243b64;stroke-width:2}.arrow{fill:none;stroke:#243b64;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#7c3cc4;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}
      .green{fill:#137c3e}.blue{fill:#145cbb}.purple{fill:#6e31b7}.orange{fill:#e65018}.pink{fill:#c51d65}.navy{fill:#112d70}.teal{fill:#087f8c}
      .badge{rx:5}.white{fill:#fff}.bold{font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1260" fill="#fff"/>

  <!-- Header -->
  <g transform="translate(18 15)">
    <path d="M0 28L27 4l27 24v35H8V28Z" fill="none" stroke="#135ee6" stroke-width="3"/>
    <rect x="15" y="31" width="28" height="20" fill="#183a67"/><rect x="39" y="47" width="9" height="9" fill="#18a558"/>
  </g>
  <text x="85" y="45" class="title">Virtualized Enterprise Security &amp; Monitoring Homelab</text>
  <text x="87" y="70" class="subtitle">FortiGate • Active Directory • Wazuh • Splunk • Kali/Burp • Nginx • OWASP Juice Shop • Docker • Trivy</text>

  <!-- Core network -->
  <g transform="translate(245 88)">
    <path d="M46 24c-3-15 17-25 29-15 10-15 36-6 35 12 15 0 20 22 5 29H46c-20-2-19-25 0-26Z" fill="#fff" stroke="#1559bd" stroke-width="2"/>
    <text x="79" y="39" text-anchor="middle" class="h navy">Internet</text>
  </g>
  <rect x="220" y="150" width="210" height="52" class="section" stroke="#1559bd"/>
  <text x="325" y="172" text-anchor="middle" class="h blue">VMware NAT (VMnet8)</text>
  <text x="325" y="191" text-anchor="middle" class="s">Gateway: 192.168.100.2</text>
  <path d="M325 138V150" class="line"/>

  <rect x="265" y="222" width="120" height="80" rx="10" fill="#e52620"/>
  <g fill="#fff"><rect x="285" y="240" width="15" height="15"/><rect x="306" y="240" width="15" height="15"/><rect x="327" y="240" width="15" height="15"/><rect x="285" y="261" width="15" height="15"/><rect x="306" y="261" width="15" height="15"/><rect x="327" y="261" width="15" height="15"/></g>
  <text x="400" y="246" class="h" fill="#333">FortiGate VM</text>
  <text x="400" y="267" class="ip orange">Firewall • NAT • DHCP • Syslog</text>
  <text x="400" y="288" class="s">WAN 192.168.100.10 / LAN 10.10.10.1</text>
  <path d="M325 202V222" class="line"/>

  <g transform="translate(245 318)">
    <rect width="160" height="42" rx="5" fill="#263238"/>
    <g fill="#cfe8ff" stroke="#fff"><rect x="14" y="11" width="18" height="16"/><rect x="38" y="11" width="18" height="16"/><rect x="62" y="11" width="18" height="16"/><rect x="86" y="11" width="18" height="16"/><rect x="110" y="11" width="18" height="16"/><rect x="134" y="11" width="12" height="16"/></g>
  </g>
  <text x="325" y="377" text-anchor="middle" class="s bold">VMnet2 Host-only LAN • 10.10.10.0/24</text>
  <path d="M325 302V318" class="line"/>

  <!-- Kali testing node -->
  <rect x="645" y="94" width="330" height="230" class="card" stroke="#7c3cc4" stroke-dasharray="6 4"/>
  <rect x="665" y="112" width="54" height="48" rx="8" fill="#151515"/>
  <text x="692" y="142" text-anchor="middle" class="h white">KALI</text>
  <text x="735" y="126" class="h purple">Kali Linux • Burp Suite</text>
  <text x="735" y="149" class="ip navy">10.10.10.40</text>
  <text x="665" y="184" class="t">• Burp Community + Firefox proxy</text>
  <text x="665" y="205" class="t">• Nmap, Wireshark, Nessus and Hydra</text>
  <text x="665" y="226" class="t">• Proxy interception and Repeater testing</text>
  <text x="665" y="247" class="t">• OWASP and ATT&amp;CK exercises</text>
  <rect x="665" y="278" width="290" height="27" class="badge" fill="#f2eaff" stroke="#7c3cc4"/>
  <text x="810" y="297" text-anchor="middle" class="s bold">AUTHORIZED TEST SOURCE • 10.10.10.40</text>
  <path d="M405 339H810V324" class="line"/>

  <!-- Network summary -->
  <rect x="1000" y="18" width="575" height="320" class="card" stroke="#1559bd"/>
  <text x="1020" y="45" class="h blue">▣  Network Summary</text>
  <text x="1020" y="71" class="t bold">WAN:</text><text x="1085" y="71" class="t">VMnet8 NAT • 192.168.100.0/24 • GW 192.168.100.2</text>
  <text x="1020" y="94" class="t bold">LAN:</text><text x="1085" y="94" class="t">VMnet2 Host-only • 10.10.10.0/24 • GW 10.10.10.1</text>
  <text x="1020" y="117" class="t bold">DNS:</text><text x="1085" y="117" class="t">10.10.10.10 (DC01)</text>
  <text x="1020" y="142" class="t bold">10.10.10.10</text><text x="1125" y="142" class="t">DC01 • AD DS • DNS</text>
  <text x="1020" y="164" class="t bold">10.10.10.20</text><text x="1125" y="164" class="t">Renz • Windows 11 • Atomic Red Team</text>
  <text x="1020" y="186" class="t bold">10.10.10.30</text><text x="1125" y="186" class="t">Wazuh Manager / SIEM</text>
  <text x="1020" y="208" class="t bold">10.10.10.40</text><text x="1125" y="208" class="t">Kali • Burp • Nmap • Nessus • Hydra</text>
  <text x="1020" y="230" class="t bold">10.10.10.50</text><text x="1125" y="230" class="t">Linux01 • auditd • FortiGate syslog</text>
  <text x="1020" y="252" class="t bold">10.10.10.60</text><text x="1125" y="252" class="t">Splunk Enterprise • SMTP alerting</text>
  <text x="1020" y="274" class="t bold">10.10.10.70</text><text x="1125" y="274" class="t">WEB01 • Nginx • Docker • Juice Shop</text>
  <text x="1020" y="302" class="s">Web target remains internal; no FortiGate WAN port-forward.</text>
  <text x="1020" y="320" class="s">Telemetry: Wazuh Agent + Splunk UF | Trivy 0.76.2</text>

  <!-- LAN bus -->
  <path d="M70 400H1530" class="line"/>
  <path d="M325 360V400" class="line"/>
  <path d="M165 400V420M455 400V420M745 400V420M1035 400V420M1325 400V420" class="line"/>

  <!-- Host cards -->
  <g transform="translate(25 420)">
    <rect width="280" height="220" class="card" stroke="#1559bd"/><rect width="280" height="35" rx="7" fill="#edf4ff"/>
    <rect x="15" y="51" width="42" height="42" rx="6" fill="#1559bd"/><text x="36" y="78" text-anchor="middle" class="h white">AD</text>
    <text x="68" y="58" class="h blue">DC01 • Windows Server</text><text x="68" y="80" class="ip navy">10.10.10.10</text>
    <text x="16" y="111" class="t">• Active Directory Domain Services</text><text x="16" y="131" class="t">• DNS and Group Policy</text>
    <text x="16" y="151" class="t">• Security, Sysmon and SMB telemetry</text><text x="16" y="171" class="t">• Wazuh Agent + Splunk Forwarder</text>
    <rect x="16" y="197" width="145" height="17" class="badge" fill="#e8f8ee"/><text x="88" y="209" text-anchor="middle" class="s bold green">IDENTITY MONITORED</text>
  </g>
  <g transform="translate(315 420)">
    <rect width="280" height="220" class="card" stroke="#1559bd"/><rect width="280" height="35" rx="7" fill="#edf4ff"/>
    <rect x="15" y="51" width="42" height="42" rx="6" fill="#1278d1"/><text x="36" y="78" text-anchor="middle" class="h white">WIN</text>
    <text x="68" y="58" class="h blue">Renz • Windows 11</text><text x="68" y="80" class="ip navy">10.10.10.20</text>
    <text x="16" y="111" class="t">• Sysmon and PowerShell telemetry</text><text x="16" y="131" class="t">• Atomic Red Team + Sigma</text>
    <text x="16" y="151" class="t">• Execution, persistence and discovery</text><text x="16" y="171" class="t">• Wazuh Agent + Splunk Forwarder</text>
    <rect x="16" y="197" width="152" height="17" class="badge" fill="#e8f8ee"/><text x="92" y="209" text-anchor="middle" class="s bold green">DETECTION VALIDATED</text>
  </g>
  <g transform="translate(605 420)">
    <rect width="280" height="220" class="card" stroke="#f04b24"/><rect width="280" height="35" rx="7" fill="#fff0eb"/>
    <rect x="15" y="51" width="42" height="42" rx="21" fill="#f04b24"/><text x="36" y="78" text-anchor="middle" class="h white">W</text>
    <text x="68" y="58" class="h orange">Wazuh SIEM</text><text x="68" y="80" class="ip navy">10.10.10.30</text>
    <text x="16" y="111" class="t">• Manager, indexer and dashboard</text><text x="16" y="131" class="t">• Endpoint, web and scan correlation</text>
    <text x="16" y="151" class="t">• Web alerts + Trivy severity rules</text><text x="16" y="171" class="t">• Threat hunting and agent health</text>
    <rect x="16" y="197" width="118" height="17" class="badge" fill="#fff0eb"/><text x="75" y="209" text-anchor="middle" class="s bold orange">ENDPOINT SIEM</text>
  </g>
  <g transform="translate(895 420)">
    <rect width="280" height="220" class="card" stroke="#d68a00"/><rect width="280" height="35" rx="7" fill="#fff7e5"/>
    <rect x="15" y="51" width="42" height="42" rx="21" fill="#ef5b19"/><text x="36" y="78" text-anchor="middle" class="h white">U</text>
    <text x="68" y="58" class="h orange">Linux01 • Ubuntu</text><text x="68" y="80" class="ip navy">10.10.10.50</text>
    <text x="16" y="111" class="t">• auditd execution and file telemetry</text><text x="16" y="131" class="t">• SSH, sudo, authentication logs</text>
    <text x="16" y="151" class="t">• FortiGate syslog receiver :514</text><text x="16" y="171" class="t">• Wazuh Agent + Splunk Forwarder</text>
    <rect x="16" y="197" width="142" height="17" class="badge" fill="#fff7e5"/><text x="87" y="209" text-anchor="middle" class="s bold orange">LINUX TELEMETRY</text>
  </g>
  <g transform="translate(1185 420)">
    <rect width="390" height="220" class="card" stroke="#168444"/><rect width="390" height="35" rx="7" fill="#ecf9f0"/>
    <rect x="15" y="51" width="42" height="42" rx="8" fill="#168444"/><text x="36" y="78" text-anchor="middle" class="h white">S</text>
    <text x="68" y="58" class="h green">Splunk Enterprise</text><text x="68" y="80" class="ip navy">10.10.10.60</text>
    <text x="16" y="111" class="t">• Centralized indexing and correlation</text><text x="16" y="131" class="t">• Web index: Nginx + Trivy JSON findings</text>
    <text x="16" y="151" class="t">• SPL field extraction and investigation</text><text x="16" y="171" class="t">• Scheduled alerts + Gmail SMTP actions</text>
    <rect x="16" y="197" width="142" height="17" class="badge" fill="#ecf9f0"/><text x="87" y="209" text-anchor="middle" class="s bold green">CENTRAL SIEM</text>
  </g>

  <!-- WEB01 application tier -->
  <path d="M310 400V665H800" class="line"/>
  <path d="M800 665V685" class="line"/>
  <rect x="485" y="685" width="630" height="185" class="card" stroke="#087f8c"/>
  <rect x="485" y="685" width="630" height="38" rx="8" fill="#e8f7f8"/>
  <rect x="507" y="742" width="54" height="54" rx="10" fill="#087f8c"/><text x="534" y="775" text-anchor="middle" class="h white">WEB</text>
  <text x="580" y="750" class="h teal">WEB01 • Ubuntu Web Security Target</text><text x="580" y="772" class="ip navy">10.10.10.70</text>
  <text x="580" y="797" class="t">Nginx :80 → Docker loopback 127.0.0.1:3000 → OWASP Juice Shop</text>
  <text x="580" y="820" class="t">Nginx + Trivy logs • Wazuh Agent • Splunk Universal Forwarder</text>
  <text x="580" y="843" class="s">Juice Shop is reachable only from the isolated VMnet2 lab and VMware host.</text>
  <rect x="930" y="742" width="155" height="28" class="badge" fill="#e8f7f8" stroke="#087f8c"/>
  <text x="1007" y="761" text-anchor="middle" class="s bold teal">OWASP TARGET</text>

  <!-- Web test and telemetry paths -->
  <path d="M975 280H985V350H1585V675H1095V685" class="dash"/>
  <rect x="990" y="652" width="225" height="17" fill="#fff"/><text x="995" y="664" class="s bold purple">Burp Proxy / Repeater HTTP requests</text>
  <path d="M690 685V650H745V640" class="dash"/>
  <path d="M910 685V645H1380V640" class="dash"/>
  <text x="1160" y="700" class="s bold purple">Nginx + Trivy JSON → Wazuh + Splunk</text>


  <!-- A03 local assessment on WEB01, not an additional VM -->
  <path d="M1115 790H1140" class="arrow"/>
  <rect x="1140" y="730" width="435" height="140" class="card" stroke="#7c3cc4"/>
  <rect x="1140" y="730" width="435" height="33" rx="7" fill="#f3eaff"/>
  <text x="1158" y="752" class="h purple">A03 • Trivy Assessment on WEB01</text>
  <text x="1158" y="781" class="t">Local image → CycloneDX SBOM → dependency scan</text>
  <text x="1158" y="804" class="t bold">592 components • 119 findings • 93 advisory IDs</text>
  <text x="1158" y="827" class="t">JSON findings → Wazuh rules + Splunk alert/email</text>
  <text x="1158" y="851" class="s">7 Critical • 23 High • 69 Medium • 15 Low • 5 Unknown</text>

  <!-- Web detection workflow -->
  <rect x="25" y="900" width="1550" height="115" class="section" stroke="#c51d65" stroke-dasharray="5 3"/>
  <text x="45" y="927" class="h pink">OWASP Validation and SOC Detection Workflow</text>
  <g transform="translate(45 948)"><rect width="220" height="47" rx="6" fill="#f3eaff" stroke="#7c3cc4"/><text x="110" y="19" text-anchor="middle" class="t bold">Controlled test</text><text x="110" y="36" text-anchor="middle" class="s">Burp or WEB01 Trivy scan</text></g>
  <g transform="translate(315 948)"><rect width="220" height="47" rx="6" fill="#e8f7f8" stroke="#087f8c"/><text x="110" y="19" text-anchor="middle" class="t bold">Application / image</text><text x="110" y="36" text-anchor="middle" class="s">Juice Shop + dependency inventory</text></g>
  <g transform="translate(585 948)"><rect width="220" height="47" rx="6" fill="#fff7e5" stroke="#d68a00"/><text x="110" y="19" text-anchor="middle" class="t bold">Security telemetry</text><text x="110" y="36" text-anchor="middle" class="s">Nginx + Trivy JSON findings</text></g>
  <g transform="translate(855 948)"><rect width="220" height="47" rx="6" fill="#ecf9f0" stroke="#168444"/><text x="110" y="19" text-anchor="middle" class="t bold">SIEM detection</text><text x="110" y="36" text-anchor="middle" class="s">Wazuh rule + Splunk SPL</text></g>
  <g transform="translate(1125 948)"><rect width="220" height="47" rx="6" fill="#fff0f6" stroke="#c51d65"/><text x="110" y="19" text-anchor="middle" class="t bold">SOC notification</text><text x="110" y="36" text-anchor="middle" class="s">Triggered alert + email</text></g>
  <path d="M265 971H315M535 971H585M805 971H855M1075 971H1125" class="arrow"/>

  <!-- Validation summaries -->
  <rect x="25" y="1040" width="745" height="145" class="section" stroke="#1559bd"/>
  <text x="45" y="1068" class="h blue">NIST CSF 2.0 + MITRE ATT&amp;CK Validation</text>
  <text x="45" y="1093" class="t">T1110.001 • T1046 • T1059.001 • T1543.003 • T1053.005</text>
  <text x="45" y="1116" class="t">T1547.001 • T1562.001 • T1070.004 • T1087.002 • T1021.002</text>
  <text x="45" y="1142" class="s">Controlled execution → host/network telemetry → correlation → alert → recovery</text>
  <rect x="45" y="1155" width="245" height="20" class="badge" fill="#edf4ff"/><text x="167" y="1169" text-anchor="middle" class="s bold blue">10 REPEATABLE EXERCISES</text>

  <rect x="795" y="1040" width="780" height="145" class="section" stroke="#087f8c"/>
  <text x="815" y="1068" class="h teal">OWASP Web + Software Supply Chain Validation</text>
  <text x="815" y="1093" class="t">A01/A02 • A03 Supply Chain • A05 Injection • A07 Authentication</text>
  <text x="815" y="1116" class="t">A03: SBOM + advisory triage + Wazuh / Splunk integration</text>
  <text x="815" y="1142" class="s">Assessment + alert workflow operator-confirmed | Final recovery evidence to attach</text>
  <rect x="815" y="1155" width="315" height="20" class="badge" fill="#e8f7f8"/><text x="972" y="1169" text-anchor="middle" class="s bold teal">WEB + DEPENDENCY SECURITY MONITORING</text>

  <rect x="25" y="1210" width="1550" height="30" rx="6" fill="#f7f9fc" stroke="#a7b3c5"/>
  <text x="40" y="1230" class="s"><tspan class="bold">Status:</tspan> Operational • Isolated and authorized testing only • No WAN exposure</text>
  <text x="1560" y="1230" text-anchor="end" class="s">Updated 18 November 2026</text>
</svg>
